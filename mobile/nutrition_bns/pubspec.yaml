name: nutrition_bns
description: Valencia City Nutrition Portal — BNS field MVP
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter_native_splash:
  color: "#1B5E20"
  image: assets/icon/app_icon.png
  android: true
  ios: false
  web: true
  android_12:
    color: "#1B5E20"
    image: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
